<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Application Result - SkillSync India</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="index.html">SkillSync India</a>
        <div class="collapse navbar-collapse"></div>
      </div>
    </nav>

    <main class="py-6">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card p-4 rounded-4 border-0" style="box-shadow: var(--shadow-md);">
              <h3 class="fw-800 mb-3">Your Application</h3>
              <div id="appContent">Loading application...</div>
              <div class="mt-4 d-flex gap-2">
                <a id="backBtn" class="btn btn-outline-secondary">Back</a>
                <button id="notifyClient" class="btn btn-primary">Ask Client To Choose</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/main.js"></script>
    <script>
      (function(){
        const appContent = document.getElementById('appContent');
        const backBtn = document.getElementById('backBtn');
        const notifyBtn = document.getElementById('notifyClient');

        const stored = JSON.parse(localStorage.getItem('lastApplication') || 'null');
        if (!stored) {
          appContent.innerHTML = '<div class="text-danger">No application found in localStorage.</div>';
        } else {
          const html = [];
          html.push(`<p><strong>Application ID:</strong> ${stored.id}</p>`);
          html.push(`<p><strong>Project ID:</strong> ${stored.projectId}</p>`);
          html.push(`<p><strong>Status:</strong> ${stored.status || 'applied'}</p>`);
          if (stored.score !== undefined && stored.score !== null) html.push(`<p><strong>Match Score:</strong> ${stored.score}%</p>`);
          html.push(`<h5 class="mt-3">Proposal</h5>`);
          html.push(`<div class="border rounded p-3 bg-white">${(stored.proposal && stored.proposal.text) ? stored.proposal.text : 'No proposal text.'}</div>`);
          appContent.innerHTML = html.join('\n');
        }

        backBtn.addEventListener('click', () => window.location.href = 'findwork.html');

        notifyBtn.addEventListener('click', async () => {
          if (!stored) return alert('No application to notify.');
          notifyBtn.disabled = true;
          notifyBtn.innerText = 'Requesting...';
          try {
            const resp = await fetch(`/api/projects/${stored.projectId}/choose`, {
              method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ applicationId: stored.id })
            });
            const json = await resp.json();
            if (json.error) alert('Error: ' + json.error);
            else alert('Client selection simulated — check client dashboard.');
          } catch (e) {
            console.error(e); alert('Request failed');
          }
          notifyBtn.disabled = false; notifyBtn.innerText = 'Ask Client To Choose';
        });
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
