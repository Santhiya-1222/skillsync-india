<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Client Dashboard - SkillSync India</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="index.html">SkillSync India</a>
        <div class="collapse navbar-collapse"></div>
      </div>
    </nav>

    <main class="py-6">
      <div class="container">
        <div class="text-center mb-4">
          <h1 class="fw-800">Client Dashboard</h1>
          <p class="text-muted">View your posted projects and review applications.</p>
        </div>

        <div id="projectsList">Loading projects...</div>
      </div>
    </main>

    <script src="js/main.js"></script>
    <script>
      (async function(){
        const projectsEl = document.getElementById('projectsList');
        try {
          const resp = await fetch('/api/projects');
          const json = await resp.json();
          const projects = (json.availableDemoProjects || []);
          if (!projects.length) {
            projectsEl.innerHTML = '<div class="text-muted">No projects found.</div>';
            return;
          }
          const out = document.createElement('div');
          projects.forEach(async (p) => {
            const wrap = document.createElement('div');
            wrap.className = 'card mb-3 p-3';
            wrap.innerHTML = `<div class="d-flex justify-content-between"><div><h5>${p.title}</h5><div class="text-muted">${p.description || ''}</div></div><div><small>Project ID: ${p.id}</small></div></div>`;
            const appsBtn = document.createElement('button');
            appsBtn.className = 'btn btn-sm btn-outline-primary mt-3 me-2';
            appsBtn.innerText = 'Load Applications';
            const chooseInfo = document.createElement('div');
            appsBtn.addEventListener('click', async () => {
              appsBtn.disabled = true; appsBtn.innerText = 'Loading...';
              const r = await fetch(`/api/applications?projectId=${encodeURIComponent(p.id)}`);
              const j = await r.json();
              const list = j.applications || [];
              const appsHtml = document.createElement('div');
              if (!list.length) appsHtml.innerHTML = '<div class="text-muted mt-2">No applications yet.</div>';
              list.forEach(a => {
                const aDiv = document.createElement('div');
                aDiv.className = 'border rounded p-3 mb-2 bg-white';
                const scoreHtml = (a.score !== undefined && a.score !== null) ? `<div class="mb-2"><strong>Match Score:</strong> ${a.score}%</div>` : '';
                aDiv.innerHTML = `<div><strong>${a.userId}</strong> — <small>${a.status}</small></div>${scoreHtml}<div class="mt-2">${a.proposal?.text ? a.proposal.text : ''}</div>`;
                const chooseBtn = document.createElement('button');
                chooseBtn.className = 'btn btn-success btn-sm mt-2';
                chooseBtn.innerText = 'Choose Applicant';
                chooseBtn.addEventListener('click', async () => {
                  chooseBtn.disabled = true; chooseBtn.innerText = 'Choosing...';
                  const res = await fetch(`/api/projects/${p.id}/choose`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ applicationId: a.id }) });
                  const jr = await res.json();
                  if (jr.error) alert('Error: ' + jr.error);
                  else alert('Applicant chosen');
                  chooseBtn.disabled = false; chooseBtn.innerText = 'Choose Applicant';
                });
                aDiv.appendChild(chooseBtn);
                appsHtml.appendChild(aDiv);
              });
              chooseInfo.innerHTML = '';
              chooseInfo.appendChild(appsHtml);
              appsBtn.disabled = false; appsBtn.innerText = 'Load Applications';
            });
            wrap.appendChild(appsBtn);
            wrap.appendChild(chooseInfo);
            out.appendChild(wrap);
          });
          projectsEl.innerHTML = '';
          projectsEl.appendChild(out);
        } catch (e) {
          console.error(e);
          projectsEl.innerHTML = '<div class="text-danger">Failed to load projects</div>';
        }
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
