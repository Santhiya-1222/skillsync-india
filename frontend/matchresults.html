<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Match Results - SkillSync India</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="index.html">SkillSync India</a>
      </div>
    </nav>

    <main class="py-6">
      <div class="container">
        <div class="d-flex justify-content-between align-items-start mb-6">
          <div>
            <h1 class="display-5 fw-900">Your Matched Opportunities</h1>
            <p class="lead">These opportunities are selected based on your skills, experience, and job preferences.</p>
          </div>
          <div>
            <span class="badge badge-primary px-3 py-2" style="font-size: 0.95rem;">
              AI Curated
            </span>
          </div>
        </div>

        <div id="results" class="list-rows"></div>
      </div>
    </main>

    <template id="cardTpl">
      <div class="job-card fade-in-up">
        <div class="card p-5 rounded-4 border-1">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div class="flex-grow-1">
              <h3 class="job-title mb-2">__TITLE__</h3>
              <p class="text-muted small mb-3" style="font-weight: 600;">__COMPANY__</p>
            </div>
          </div>
          
          <div class="job-budget mb-3">₹__BUDGET__</div>
          
          <div class="job-meta mb-3">
            <span class="job-meta-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
              </svg>
              <span>__POSTED__</span>
            </span>
            <span class="job-meta-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
              </svg>
              <span>__LOCATION__</span>
            </span>
          </div>

          <div class="tags mb-4">__TAGS__</div>

          <p class="card-text mb-4">__DESC__</p>

          <div class="d-flex gap-2">
            <button class="btn btn-apply btn-lg flex-grow-1" onclick="generateProposal(this)">
              Apply with Proposal
            </button>
            <button class="btn btn-secondary btn-lg" onclick="saveJob(this)">
              Save
            </button>
          </div>

          <div class="mt-4 proposalText d-none" style="display: none;"></div>
        </div>
        <div class="match-badge">__SCORE__% Match</div>
      </div>
    </template>

    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
